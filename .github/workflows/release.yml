name: Release UniText VPM Package

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.2.0)'
        required: false
      notify_vpm:
        description: 'Trigger Dreaminko VPM Repository listing rebuild'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/font-atlas/requirements.txt -r tools/osc-tester/requirements.txt

      - name: Run UniText end-to-end validation suite
        run: python tools/test_all.py

      - name: Determine release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_ID="$(python3 -c 'import json; print(json.load(open("unity/Packages/dev.dreaminko.unitext/package.json", encoding="utf-8"))["name"])')"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("unity/Packages/dev.dreaminko.unitext/package.json", encoding="utf-8"))["version"])')"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_TAG}" ]; then
              TAG="${INPUT_TAG}"
            else
              TAG="${MANIFEST_VERSION}"
            fi
          else
            TAG="${REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "package_id=${PACKAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack VPM archive and release package.json
        run: |
          python tools/vpm/pack_vpm.py \
            --out-dir dist \
            --repo "${{ github.repository }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --tag "${{ steps.meta.outputs.tag }}"

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/package.json

      - name: Notify Dreaminko VPM Repository
        if: startsWith(github.ref, 'refs/tags/') || inputs.notify_vpm == true
        shell: bash
        env:
          VPM_DISPATCH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
          VPM_LISTING_REPO: ${{ vars.VPM_LISTING_REPO || 'Dreaminko/vpm' }}
          SOURCE_REPO: ${{ github.repository }}
          PACKAGE_ID: ${{ steps.meta.outputs.package_id }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -z "${VPM_DISPATCH_TOKEN}" ]; then
            echo "::warning::VPM_DISPATCH_TOKEN is not configured. Skipping repository_dispatch to ${VPM_LISTING_REPO}. Add a Fine-grained PAT with 'Contents: Read and write' on ${VPM_LISTING_REPO} as secret VPM_DISPATCH_TOKEN to enable automatic VPM listing updates."
            exit 0
          fi

          PAYLOAD="$(python3 -c 'import json, os; print(json.dumps({"event_type": "package-released", "client_payload": {"repository": os.environ["SOURCE_REPO"], "package": os.environ["PACKAGE_ID"], "version": os.environ["VERSION"], "tag": os.environ["TAG"]}}))')"

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${VPM_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${VPM_LISTING_REPO}/dispatches" \
            -d "${PAYLOAD}"
